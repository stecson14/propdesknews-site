<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>You're offline | Prop Desk</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" href="/icons/icon-48.png" type="image/png" sizes="48x48">
<style>
@font-face{font-family:"IBM Plex Sans";font-style:normal;font-weight:400 600;font-display:swap;src:url(/fonts/ibmplexsans-var.woff2) format("woff2")}
@font-face{font-family:"Fraunces";font-style:normal;font-weight:500 700;font-display:swap;src:url(/fonts/fraunces-var.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-style:normal;font-weight:400;font-display:swap;src:url(/fonts/ibmplexmono-400.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-style:normal;font-weight:500;font-display:swap;src:url(/fonts/ibmplexmono-500.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-style:normal;font-weight:600;font-display:swap;src:url(/fonts/ibmplexmono-600.woff2) format("woff2")}
</style>
<style>
:root{--bg:#121825;--surface:#1A2233;--ink:#E9E4D4;--muted:#A3A8B5;--line:#2E3850;--mustard:#D9A441;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:15.5px;line-height:1.55}
.wrap{max-width:560px;margin:0 auto;padding:40px 16px 60px;display:grid;gap:14px}
.k{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mustard)}
h1{font-family:Fraunces,Georgia,serif;font-weight:700;font-size:34px;line-height:1.05;margin:0}
p{margin:0;color:var(--muted)}
a.btn{display:block;background:#E9E4D4;color:#1A2233;text-decoration:none;border-radius:10px;padding:14px 16px;font:600 14px "IBM Plex Mono",ui-monospace,monospace;text-align:center}
img{width:72px;height:72px;border-radius:50%;border:2px solid var(--mustard)}
</style>
</head>
<body>
<div class="wrap">
  <img src="/icons/avatar-144.jpg" alt="" width="72" height="72">
  <div class="k">Prop Desk</div>
  <h1>You're offline</h1>
  <p>Deals and rules change every day, so Prop Desk won't show you a page it hasn't seen. Pages you opened before are still available; this one isn't on your device yet.</p>
  <a class="btn" href="/">Try again</a>
  <p>Education, not financial advice.</p>
</div>
</body>
</html>
